[project]
name = "shonenchat"
version = "0.1.0"
description = "ShonenChat the one stop for your shonen questions."
readme = "README.md"
authors = [
    { name = "SURYAPRASATHJP", email = "suryaspt1282@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
shonenchat = "shonenchat.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E,F  pycodestyle and pyflakes: the errors that are actually errors.
# I    import sorting, so a diff never contains a reordered import block.
# UP   pyupgrade: flags 3.8-era syntax we have no reason to write on 3.13.
# B    bugbear: real bug shapes, e.g. a mutable default argument.
# SIM  simplify: collapses the needlessly long way of writing a thing.
# RUF  ruff's own rules.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
