[project]
name = "shonenchat"
version = "0.1.0"
description = "ShonenChat the one stop for your shonen questions."
readme = "README.md"
authors = [
    { name = "SURYAPRASATHJP", email = "suryaspt1282@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
    "httpx>=0.28.1",
]

[project.scripts]
shonenchat = "shonenchat.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy",
    "pytest>=9.1.1",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E,F  pycodestyle and pyflakes: the errors that are actually errors.
# I    import sorting, so a diff never contains a reordered import block.
# UP   pyupgrade: flags 3.8-era syntax we have no reason to write on 3.13.
# B    bugbear: real bug shapes, e.g. a mutable default argument.
# SIM  simplify: collapses the needlessly long way of writing a thing.
# RUF  ruff's own rules.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
# pydantic's __init__ accepts what a field can be *validated from*, not
# only what it is *stored as*: HttpUrl is built from a str. Plain mypy
# reads the annotation and calls that a type error. The plugin teaches it
# the difference. Without it the only fixes are wrapping every value at
# the call site or weakening the field back to str, and both throw away
# the guarantee to keep the checker quiet.
plugins = ["pydantic.mypy"]
files = ["src"]
# strict is nine flags at once. The two that matter today:
# disallow_untyped_defs, so an unannotated function cannot hide from the
# checker, and disallow_any_generics, so a bare `dict` is an error rather
# than silently meaning `dict[Any, Any]` and switching checking off.
strict = true

[tool.pytest.ini_options]
# Tests live in tests/ and import the package by its installed name, so
# the run is against what ships, not a src/ path trick.
testpaths = ["tests"]
addopts = "-q"
